<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بوابة الدفع الإلكتروني | فلسطين</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            // تعريف ألوان مخصصة لكل مزود
            bop: { 500: '#f59e0b', 600: '#d97706', 900: '#78350f' },     // بنك فلسطين (برتقالي/عنبري)
            palpay: { 500: '#0ea5e9', 600: '#0284c7', 900: '#0c4a6e' },  // بال بي (أزرق سماوي)
            jawwal: { 500: '#e11d48', 600: '#be123c', 900: '#881337' },  // جوال بي (أحمر وردي)
          },
          fontFamily: {
            sans: ['Cairo', 'Tajawal', 'sans-serif'],
            mono: ['Consolas', 'monospace'],
          }
        }
      }
    }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Cairo', 'Tajawal', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    /* تأثيرات حركية ناعمة للتبويبات */
    .tab-btn {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .tab-content-enter {
      animation: fadeIn 0.4s ease-out forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen transition-colors duration-300 flex flex-col items-center">

  <header class="w-full max-w-4xl mx-auto px-4 py-6 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-slate-700 to-slate-500 dark:from-slate-600 dark:to-slate-400 flex items-center justify-center text-white shadow-lg font-black text-2xl">
        ₪
      </div>
      <div>
        <h1 class="text-xl md:text-2xl font-black tracking-tight">بوابة الدفع السريع</h1>
        <p class="text-xs md:text-sm text-slate-500 dark:text-slate-400 font-semibold mt-1">
          نظام محاكاة الدفع الإلكتروني الموحد
        </p>
      </div>
    </div>

    <!-- Theme Toggle Button -->
    <button onclick="toggleTheme()" class="p-3 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all shadow-sm" aria-label="تبديل النمط">
      <!-- Sun Icon -->
      <svg id="sunIcon" class="w-6 h-6 hidden text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 9H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
      <!-- Moon Icon -->
      <svg id="moonIcon" class="w-6 h-6 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg>
    </button>
  </header>

  <main class="w-full max-w-4xl mx-auto px-4 py-4 flex-1">
    
    <!-- Tabs Navigation -->
    <div class="bg-white dark:bg-slate-900 p-2 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-sm flex flex-col md:flex-row gap-2 mb-8">
      
      <!-- Tab 1: Bank of Palestine -->
      <button onclick="switchTab('bop')" id="tab-bop" class="tab-btn flex-1 py-4 px-6 rounded-2xl font-black text-sm md:text-base border-2 border-transparent text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-200 flex items-center justify-center gap-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 14v3m4-3v3m4-3v3M3 21h18M3 10h18M3 7l9-4 9 4M4 10h16v11H4V10z"/></svg>
        بنك فلسطين
      </button>

      <!-- Tab 2: PalPay -->
      <button onclick="switchTab('palpay')" id="tab-palpay" class="tab-btn flex-1 py-4 px-6 rounded-2xl font-black text-sm md:text-base border-2 border-transparent text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-200 flex items-center justify-center gap-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/></svg>
        محفظة بال بي
      </button>

      <!-- Tab 3: Jawwal Pay -->
      <button onclick="switchTab('jawwal')" id="tab-jawwal" class="tab-btn flex-1 py-4 px-6 rounded-2xl font-black text-sm md:text-base border-2 border-transparent text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-200 flex items-center justify-center gap-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>
        محفظة جوال بي
      </button>

    </div>

    <!-- Form Area -->
    <div id="formContainer" class="bg-white dark:bg-slate-900 rounded-[2rem] p-6 md:p-10 border border-slate-200 dark:border-slate-800 shadow-xl tab-content-enter transition-all duration-300">
      
      <div class="flex items-center gap-3 mb-8">
        <div id="providerIcon" class="w-12 h-12 rounded-full flex items-center justify-center text-white font-bold text-xl transition-colors duration-300">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
        </div>
        <div>
          <h2 id="providerTitle" class="text-xl font-black text-slate-800 dark:text-white">يرجى اختيار مزود الخدمة</h2>
          <p id="providerSubtitle" class="text-sm text-slate-500 dark:text-slate-400 font-semibold mt-1">أدخل بيانات العملية أدناه</p>
        </div>
      </div>

      <form id="paymentForm" onsubmit="handleFormSubmit(event)" class="space-y-6 hidden">
        
        <!-- Dropdown: Payment Type -->
        <div>
          <label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-2">
            نوع العملية
          </label>
          <div class="relative">
            <select id="paymentType" onchange="updateLabels()" class="w-full appearance-none rounded-2xl border-2 border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 px-5 py-4 text-base font-bold text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-0 transition-colors cursor-pointer">
              <option value="merchant">دفع للتاجر (P2M)</option>
              <option value="friend">دفع لصديق (P2P)</option>
            </select>
            <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center px-5 text-slate-500">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
            </div>
          </div>
        </div>

        <!-- Input: Number (Merchant ID or Friend Number) -->
        <div>
          <label id="targetLabel" class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-2">
            رقم التاجر
          </label>
          <input type="number" id="targetNumber" placeholder="أدخل الرقم هنا..." required class="w-full rounded-2xl border-2 border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 px-5 py-4 text-lg font-bold text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-0 transition-colors placeholder:font-normal placeholder:text-slate-400">
        </div>

        <!-- Input: Amount -->
        <div>
          <label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-2">
            المبلغ المراد دفعه
          </label>
          <div class="relative flex items-center">
            <input type="number" id="amount" placeholder="0.00" required min="1" step="0.01" class="w-full rounded-2xl border-2 border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 px-5 py-4 text-xl font-black font-mono text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-0 transition-colors">
            <span class="absolute left-5 font-bold text-slate-500 dark:text-slate-400 bg-slate-200 dark:bg-slate-700 px-3 py-1 rounded-lg">شيكل ₪</span>
          </div>
        </div>

        <!-- Submit Button -->
        <div class="pt-4">
          <button type="submit" id="submitBtn" class="w-full py-4 rounded-2xl font-black text-lg text-white shadow-xl transition-all transform hover:-translate-y-1 active:translate-y-0 flex items-center justify-center gap-3">
            <span>تنفيذ العملية</span>
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
          </button>
        </div>
      </form>

      <!-- Placeholder before selecting a tab -->
      <div id="emptyState" class="text-center py-12">
        <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-400 mb-4">
          <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122"/></svg>
        </div>
        <h3 class="text-lg font-bold text-slate-600 dark:text-slate-300">الرجاء اختيار مزود الخدمة من الأعلى</h3>
        <p class="text-slate-400 dark:text-slate-500 text-sm mt-2">لتتمكن من إدخال بيانات الدفع وإتمام العملية</p>
      </div>

    </div>
    
    <!-- Result Overlay (Custom MessageBox instead of alert) -->
    <div id="resultOverlay" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
      <div class="bg-white dark:bg-slate-900 rounded-3xl p-8 max-w-sm w-full shadow-2xl transform transition-all text-center border border-slate-200 dark:border-slate-800">
        <div id="resultIcon" class="w-20 h-20 mx-auto rounded-full flex items-center justify-center text-white mb-6">
          <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        </div>
        <h3 class="text-2xl font-black text-slate-800 dark:text-white mb-2">ملخص العملية</h3>
        <p id="resultText" class="text-slate-600 dark:text-slate-400 font-bold mb-6 text-sm leading-relaxed"></p>
        <button onclick="closeResult()" class="w-full py-3 rounded-xl bg-slate-800 dark:bg-slate-100 text-white dark:text-slate-900 font-bold hover:opacity-90 transition-opacity">
          حسناً، إغلاق
        </button>
      </div>
    </div>

  </main>

  <script>
    // Theme Management
    function initTheme() {
      const isDark = document.documentElement.classList.contains('dark') || 
        (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches);
      applyTheme(isDark);
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      applyTheme(isDark);
    }

    function applyTheme(isDark) {
      document.getElementById('sunIcon').classList.toggle('hidden', !isDark);
      document.getElementById('moonIcon').classList.toggle('hidden', isDark);
    }

    // Providers Data Setup
    const providers = {
      bop: {
        title: 'بنك فلسطين',
        colorClass: 'bg-bop-500',
        borderColor: 'border-bop-500',
        textColor: 'text-bop-600 dark:text-bop-500',
        bgLight: 'bg-bop-50 dark:bg-bop-900/20',
        focusRing: 'focus:border-bop-500 focus:ring-bop-500',
        buttonClass: 'bg-gradient-to-r from-bop-500 to-bop-600 hover:from-bop-600 hover:to-bop-700'
      },
      palpay: {
        title: 'محفظة بال بي',
        colorClass: 'bg-palpay-500',
        borderColor: 'border-palpay-500',
        textColor: 'text-palpay-600 dark:text-palpay-500',
        bgLight: 'bg-palpay-50 dark:bg-palpay-900/20',
        focusRing: 'focus:border-palpay-500 focus:ring-palpay-500',
        buttonClass: 'bg-gradient-to-r from-palpay-500 to-palpay-600 hover:from-palpay-600 hover:to-palpay-700'
      },
      jawwal: {
        title: 'محفظة جوال بي',
        colorClass: 'bg-jawwal-500',
        borderColor: 'border-jawwal-500',
        textColor: 'text-jawwal-600 dark:text-jawwal-500',
        bgLight: 'bg-jawwal-50 dark:bg-jawwal-900/20',
        focusRing: 'focus:border-jawwal-500 focus:ring-jawwal-500',
        buttonClass: 'bg-gradient-to-r from-jawwal-500 to-jawwal-600 hover:from-jawwal-600 hover:to-jawwal-700'
      }
    };

    let currentProvider = null;

    // Tab Switching Logic
    function switchTab(providerId) {
      currentProvider = providerId;
      const prov = providers[providerId];
      
      // Reset all tabs
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.className = 'tab-btn flex-1 py-4 px-6 rounded-2xl font-black text-sm md:text-base border-2 border-transparent text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-200 flex items-center justify-center gap-2 bg-transparent shadow-none';
      });

      // Activate selected tab
      const activeTab = document.getElementById(`tab-${providerId}`);
      activeTab.className = `tab-btn flex-1 py-4 px-6 rounded-2xl font-black text-sm md:text-base border-2 ${prov.borderColor} ${prov.textColor} ${prov.bgLight} flex items-center justify-center gap-2 shadow-sm transform scale-[1.02]`;

      // Update Form UI
      document.getElementById('emptyState').classList.add('hidden');
      const form = document.getElementById('paymentForm');
      form.classList.remove('hidden');
      
      // Re-trigger animation
      const container = document.getElementById('formContainer');
      container.classList.remove('tab-content-enter');
      void container.offsetWidth; // Trigger reflow
      container.classList.add('tab-content-enter');

      // Update Header info inside form
      document.getElementById('providerTitle').textContent = prov.title;
      const icon = document.getElementById('providerIcon');
      icon.className = `w-12 h-12 rounded-full flex items-center justify-center text-white font-bold text-xl transition-colors duration-300 shadow-lg ${prov.colorClass}`;

      // Update Inputs Focus Rings & Button Colors
      const inputs = document.querySelectorAll('#paymentForm input, #paymentForm select');
      inputs.forEach(input => {
        input.className = `w-full rounded-2xl border-2 border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 px-5 py-4 text-lg font-bold text-slate-800 dark:text-slate-100 focus:outline-none transition-colors placeholder:font-normal placeholder:text-slate-400 ${prov.focusRing}`;
      });
      
      // Select dropdown specifically to adjust appearance class
      document.getElementById('paymentType').classList.add('appearance-none');

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.className = `w-full py-4 rounded-2xl font-black text-lg text-white shadow-xl transition-all transform hover:-translate-y-1 active:translate-y-0 flex items-center justify-center gap-3 ${prov.buttonClass}`;

      // Call updateLabels to ensure correct text based on active payment type
      updateLabels();
    }

    // Dynamic Label updating based on Select option
    function updateLabels() {
      const type = document.getElementById('paymentType').value;
      const targetLabel = document.getElementById('targetLabel');
      const targetInput = document.getElementById('targetNumber');

      if (type === 'merchant') {
        targetLabel.textContent = 'رقم التاجر';
        targetInput.placeholder = 'أدخل كود التاجر المعتمد...';
      } else {
        targetLabel.textContent = 'رقم جوال الصديق / المستفيد';
        targetInput.placeholder = 'مثال: 0599123456';
      }
    }

    // Handle Form Submit
    function handleFormSubmit(e) {
      e.preventDefault();
      
      const type = document.getElementById('paymentType').value;
      const typeText = type === 'merchant' ? 'دفع لتاجر' : 'دفع لصديق';
      const target = document.getElementById('targetNumber').value;
      const amount = document.getElementById('amount').value;
      const prov = providers[currentProvider];

      const resultText = `
        تم تسجيل طلب العملية بنجاح.
        <br><br>
        <span class="text-slate-500">المزود:</span> <span class="text-slate-800 dark:text-slate-100">${prov.title}</span><br>
        <span class="text-slate-500">النوع:</span> <span class="text-slate-800 dark:text-slate-100">${typeText}</span><br>
        <span class="text-slate-500">الرقم/المعرف:</span> <span class="font-mono text-slate-800 dark:text-slate-100">${target}</span><br>
        <span class="text-slate-500">المبلغ:</span> <span class="font-mono text-slate-800 dark:text-slate-100">${amount} ₪</span>
      `;

      document.getElementById('resultText').innerHTML = resultText;
      const icon = document.getElementById('resultIcon');
      icon.className = `w-20 h-20 mx-auto rounded-full flex items-center justify-center text-white mb-6 shadow-xl ${prov.colorClass}`;
      
      const overlay = document.getElementById('resultOverlay');
      overlay.classList.remove('hidden');
      overlay.classList.add('flex');
    }

    // Close Modal
    function closeResult() {
      const overlay = document.getElementById('resultOverlay');
      overlay.classList.add('hidden');
      overlay.classList.remove('flex');
    }

    // Initialize defaults on load
    window.addEventListener('DOMContentLoaded', () => {
      initTheme();
    });
  </script>
</body>
</html>
